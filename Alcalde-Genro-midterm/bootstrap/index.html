<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #9ACD32;">

<div class="container">
    <div class="row justify-content-center align-items-center" style="height: 100vh;">
        <div class="col-12 col-md-4">
            <div class="card p-4" id="login-card">
                <h2 class="text-center mb-4"></h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="uname" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" id="pword" placeholder="Password" required>
                    </div>
                    <button type="button" class="btn btn-success w-100" onclick="validateLogin()">Login</button>
                    <p class="text-danger mt-3" id="error-message" style="display: none;"></p>
                </form>
                <p class="text-center mt-3">
                    <a href="register.html" class="text-blue">Not registered? Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function validateLogin() {
        var username = document.getElementById("uname").value;
        var password = document.getElementById("pword").value;

        var validUsername = "admin123";
        var validPassword = "adminpass123";

        if (username === validUsername && password === validPassword) {
            alert("Login successful!");
           
            document.getElementById("login-card").classList.add("animate__animated", "animate__fadeOut");
        } else {
            var errorMessage = document.getElementById("error-message");
            errorMessage.innerText = "Invalid username or password.";
            errorMessage.style.display = "block";
            errorMessage.classList.add("animate__animated", "animate__fadeIn");
        }
    }

    window.onload = function() {
        document.getElementById("login-card").classList.add("animate__animated", "animate__fadeIn");
    }
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

</body>
</html>
