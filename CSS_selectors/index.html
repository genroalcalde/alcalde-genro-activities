<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            color:blueviolet;
            background-color: green;
        }

        p {
            front-size: 50px;
        }

        #ulabel{
            border:5px yellow solid;
        }

        #plabel{
            border: 10px brown solid;
        }

        .red-text{
            color:black;
        }

        .blue-bg {
            blackground-color:green;
        }
    </style>
</head>
<body>
   <h1>LOGIN</h1>
   <h1>This is sample login</h1>
   <br>
   <p id="ulabel" class="yellow-text green-bg">Username:</p>
   <input type="text" name="username" id="username">
   <br>
   <p id="plabel" class="green-text yellow">Password:</p>
   <input type="password" name="password" id="password">
</body>
</html>
